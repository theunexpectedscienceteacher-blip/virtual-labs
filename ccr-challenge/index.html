<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCR Challenge</title><style>body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}header{background:#202838;color:#fff;text-align:center;padding:18px}.w{max-width:900px;margin:auto;padding:16px}.card{background:white;border:1px solid #d9e1ea;border-radius:16px;padding:18px}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{background:white;border:1px solid #d9e1ea;border-radius:99px;padding:8px 12px;font-weight:bold}.scene{height:340px;border:2px solid #d9e1ea;border-radius:15px;position:relative;overflow:hidden;background:linear-gradient(#eef6fc,#fff);display:flex;align-items:center;justify-content:center}.title{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:21px;font-weight:bold}.visual{font-size:90px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.b{padding:13px;border:1px solid #d9e1ea;border-radius:11px;background:white;font-weight:bold;cursor:pointer}.primary{background:#7c3aed;color:white}.feedback{padding:13px;background:#f8fafc;border-radius:10px;margin-top:12px;min-height:50px}.good{background:#f0fdf4;color:#166534}.bad{background:#fef2f2;color:#991b1b}.hidden{display:none}.arrow{position:absolute;font-size:44px;color:#ef7d32;animation:r 1.4s infinite}.a1{left:38%;bottom:45px}.a2{left:55%;bottom:100px}.wave{position:absolute;width:135px;height:16px;border-top:5px solid #f59e0b;border-radius:50%;animation:w 1s infinite}.contact{position:absolute;width:110px;height:8px;background:#ef4444;border-radius:9px;left:44%;top:58%}.lava{width:140px;height:240px;border:9px solid #4b5563;border-radius:48% 48% 25% 25%;background:#f7d7a7;position:relative;overflow:hidden}.blob{position:absolute;width:50px;height:65px;border-radius:50%;background:#ef7d32;left:42px;animation:l 3s infinite}.b2{width:35px;height:45px;left:20px;animation-delay:1.1s}@keyframes r{from{transform:translateY(45px);opacity:.2}to{transform:translateY(-120px);opacity:.9}}@keyframes w{50%{transform:translateX(20px);opacity:.3}}@keyframes l{0%,100%{bottom:-50px}50%{bottom:160px}}@media(max-width:650px){.choices{grid-template-columns:1fr}}</style></head><body><header><a href="../" style="color:#c4b5fd;font-weight:bold;text-decoration:none;display:block;text-align:left;margin-bottom:6px">&larr; All Labs</a><h1>🔥 CCR Challenge</h1><p>How Is Thermal Energy Moving?</p></header><main class="w"><div class="top"><div class="pill">Question <span id="num">1</span>/10</div><div class="pill">Score: <span id="score">0</span></div><div class="pill">Streak: <span id="streak">0</span> 🔥</div></div><section id="game" class="card"><h2>Study the animation. Which type of heat transfer is highlighted?</h2><div class="scene"><div id="title" class="title"></div><div id="art"></div></div><div class="choices"><button class="b ans" data-a="conduction">♨️ Conduction<br><small>direct contact</small></button><button class="b ans" data-a="convection">💨 Convection<br><small>moving fluid</small></button><button class="b ans" data-a="radiation">☀️ Radiation<br><small>energy waves</small></button></div><div id="fb" class="feedback">Choose an answer.</div><button id="next" class="b primary hidden" style="margin-top:10px">Next Example →</button></section><section id="finish" class="card hidden" style="text-align:center"><h1><span id="final">0</span>/10</h1><h2>Challenge Complete!</h2><p>Conduction = contact • Convection = moving fluid • Radiation = energy waves</p><button id="again" class="b primary">🔀 Play Again</button></section></main><script>
const E=[{t:"Lava Lamp",a:"convection",w:"Heated fluid becomes less dense and rises; cooler fluid sinks, creating a convection current.",v:`<div class="lava"><span class="blob"></span><span class="blob b2"></span></div>`},{t:"Metal Spoon in Hot Soup",a:"conduction",w:"The spoon directly touches the hot soup, so energy transfers by contact.",v:`<div class="visual">🥣🥄</div><div class="contact"></div>`},{t:"Sun Warming Pavement",a:"radiation",w:"Energy travels from the Sun to the pavement by electromagnetic waves.",v:`<div class="visual">☀️　🛣️</div><span class="wave" style="left:40%;top:48%"></span>`},{t:"Convection Oven",a:"convection",w:"A fan circulates hot air, and the moving gas carries thermal energy.",v:`<div class="visual">🌀🍪</div><span class="arrow a1">↑</span><span class="arrow a2">↗</span>`},{t:"Hand Touching a Hot Pan",a:"conduction",w:"The hand and pan touch, so energy transfers by direct contact.",v:`<div class="visual">✋🍳</div><div class="contact"></div>`},{t:"Heat Lamp Warming Food",a:"radiation",w:"The lamp transfers energy to the food by electromagnetic waves.",v:`<div class="visual">💡　🍟</div><span class="wave" style="left:40%;top:48%"></span>`},{t:"Boiling Water Circulating",a:"convection",w:"Warmer water rises while cooler water sinks, forming convection currents.",v:`<div class="visual">🍲</div><span class="arrow a1">↑</span><span class="arrow a2">↓</span>`},{t:"Iron Touching a Shirt",a:"conduction",w:"The hot iron directly touches the fabric.",v:`<div class="visual">👕 ♨️</div><div class="contact"></div>`},{t:"Feeling Warmth From a Campfire",a:"radiation",w:"Energy travels from the fire across space without touching you.",v:`<div class="visual">🔥　🧍</div><span class="wave" style="left:40%;top:48%"></span>`},{t:"Warm Air Rising From a Heater",a:"convection",w:"Heated air becomes less dense and rises.",v:`<div class="visual">♨️</div><span class="arrow a1">↑</span><span class="arrow a2">↗</span>`},{t:"Egg on a Hot Griddle",a:"conduction",w:"The egg directly contacts the hot griddle.",v:`<div class="visual">🍳</div><div class="contact"></div>`},{t:"Toaster Heating Bread",a:"radiation",w:"Glowing heating elements emit infrared radiation toward the bread.",v:`<div class="visual">🍞 ♨️</div><span class="wave" style="left:40%;top:48%"></span>`}];const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];let order,i,score,streak,answered;function start(){order=[...E].sort(()=>Math.random()-.5).slice(0,10);i=score=streak=0;q("#game").classList.remove("hidden");q("#finish").classList.add("hidden");show()}function show(){answered=false;let e=order[i];q("#num").textContent=i+1;q("#score").textContent=score;q("#streak").textContent=streak;q("#title").textContent=e.t;q("#art").innerHTML=e.v;q("#fb").className="feedback";q("#fb").textContent="Choose an answer.";q("#next").classList.add("hidden");qa(".ans").forEach(b=>b.disabled=false)}qa(".ans").forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let e=order[i],ok=b.dataset.a===e.a;if(ok){score++;streak++;q("#fb").className="feedback good";q("#fb").innerHTML="<b>✅ Correct!</b> "+e.w}else{streak=0;q("#fb").className="feedback bad";q("#fb").innerHTML="<b>Not this time. This is "+e.a+".</b> "+e.w}q("#score").textContent=score;q("#streak").textContent=streak;qa(".ans").forEach(x=>x.disabled=true);q("#next").classList.remove("hidden")});q("#next").onclick=()=>{if(++i>=10){q("#game").classList.add("hidden");q("#finish").classList.remove("hidden");q("#final").textContent=score}else show()};q("#again").onclick=start;start();</script></body></html>
